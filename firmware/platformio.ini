; ============================================================================
; Smart Door KOS — Firmware ESP32 (TARGET 1)
; PlatformIO project configuration
;
; Dua environment:
;   [env:esp32dev] — build/flash ke perangkat ESP32 (framework Arduino + LittleFS)
;   [env:native]   — host/native build untuk unit & property test logika portabel
;                    (tasks 22.x) tanpa perlu hardware
;
; Scaffolding saja (Task 21): belum dikompilasi di workspace ini
; (tidak ada toolchain/hardware). Lihat README.md.
; ============================================================================

[platformio]
; Semua environment yang dibangun secara default.
; 'native' dikecualikan dari default build agar tidak butuh board saat test host
; dipanggil eksplisit: `pio test -e native`.
default_envs = esp32dev
src_dir = src
lib_dir = lib
test_dir = test
data_dir = data

; ----------------------------------------------------------------------------
; Opsi bersama untuk semua environment ESP32
; ----------------------------------------------------------------------------
[env]
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    ; Batasi penggunaan StaticJsonDocument / dokumen terukur (Req 18.3).
    -D ARDUINOJSON_ENABLE_STD_STRING=1

; ----------------------------------------------------------------------------
; ESP32 — build & flash target (Arduino framework, LittleFS)
; ----------------------------------------------------------------------------
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; Gunakan LittleFS sebagai filesystem flash (whitelist/logs/config/device.key).
board_build.filesystem = littlefs
; Partisi dengan ruang SPIFFS/LittleFS + slot OTA ganda untuk Task 28.
board_build.partitions = default.csv

build_flags =
    ${env.build_flags}
    -D CORE_DEBUG_LEVEL=3
    ; Flag build khusus perangkat dapat ditambahkan di sini (pin, fitur).

; Dependensi pustaka firmware (Req 4.1, 5.1, 7.x, 18.x).
; Versi di-pin untuk build yang dapat direproduksi.
lib_deps =
    bblanchon/ArduinoJson@^7.1.0
    knolleary/PubSubClient@^2.8
    adafruit/RTClib@^2.1.4
    ; Driver NFC — PN532 (default). Untuk RC522 gunakan miguelbalboa/MFRC522.
    adafruit/Adafruit PN532@^1.3.3
    ; RC522 alternatif (aktifkan bila memakai modul RC522):
    ; miguelbalboa/MFRC522@^1.4.11
    ; Adafruit PN532 bergantung pada Adafruit BusIO:
    adafruit/Adafruit BusIO@^1.16.1

; ----------------------------------------------------------------------------
; Native — unit & property test logika portabel di host (Task 22.x / 22.4)
; Tidak memuat Arduino/hardware; hanya modul C++ murni di lib/.
; Jalankan: `pio test -e native`
; ----------------------------------------------------------------------------
[env:native]
platform = native

build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    ; ArduinoJson berjalan di host tanpa Arduino.String.
    -D ARDUINOJSON_ENABLE_ARDUINO_STRING=0
    -D UNIT_TEST=1

; Hanya pustaka portabel (header-only / murni) yang dibutuhkan untuk test host.
lib_deps =
    bblanchon/ArduinoJson@^7.1.0

; Framework uji host bawaan PlatformIO (Unity). Generator property dapat
; ditulis di atasnya pada Task 22.4.
test_framework = unity
